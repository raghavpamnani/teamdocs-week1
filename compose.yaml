services:
  teamdocs:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATA_DIR: /app/data
    volumes:
      - teamdocs-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  teamdocs-data:
